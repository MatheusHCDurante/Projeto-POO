name: Discord
on:
  - push
jobs:
  Discord:
      runs-on: ubuntu-latest
      steps:
        - uses: actions/checkout@v4
        - name: Run Discord Webhook
          uses: tsickert/discord-webhook@v7.0.0
          with:
            webhook-url: ${{ secrets.DISCORD_WEBHOOK }}
            content: "Novo commit realizado"
            flags: true
            embed-author-name: true
---
name: Continuous Integration
on: 
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:

      - name: Check out repository code
        uses: actions/checkout@v6

      - name: Lint Code Base
        uses: github/super-linter@v4
        env:
          VALIDATE_ALL_CODEBASE: false
          DEFAULT_BRANCH: "main"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Baixar JUnit
        working-directory: Banco
        run: |
          mkdir -p lib
          curl -sSL -o lib/junit-platform-console-standalone-6.0.1.jar \
            https://repo1.maven.org/maven2/org/junit/platform/junit-platform-console-standalone/6.0.1/junit-platform-console-standalone-6.0.1.jar

      - name: Compilar o projeto
        working-directory: Banco
        run: |
          mkdir -p bin
          find src test -name "*.java" > sources.txt
          javac -cp "lib/*" -d bin @sources.txt

      - name: Rodar os testes
        working-directory: Banco
        run: java -jar lib/junit-platform-console-standalone-6.0.1.jar execute 
          --classpath bin 
          --scan-classpath
          --details tree

      - name: Empacotar em .jar
        working-directory: Banco
        run: |
          cd bin
          jar cfe ../Banco.jar main.Main $(find . -name "*.class")
